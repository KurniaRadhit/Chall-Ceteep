services:
  fmt2win:
    build:
      context: .
      args:
        FLAG: "LKS{e92b7a4c1d8f6035a9c2e7b4f16d8305}"
    container_name: fmt2win
    ports:
      - "9999:9999"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 50
    mem_limit: 128m
    cpus: 0.5
